<svg xmlns="http://www.w3.org/2000/svg" width="960" height="260" viewBox="0 0 960 260" role="img" aria-labelledby="title desc">
  <title id="title">Заглушка скриншота 3: проверка HTTPS</title>
  <desc id="desc">Место для снимка успешного nginx -t и ответа backend по HTTPS с проверкой сертификата.</desc>
  <rect x="2" y="2" width="956" height="256" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>
  <g fill="#0f172a" font-family="sans-serif" text-anchor="middle">
    <text x="480" y="80" font-size="18">СКРИНШОТ 3 · ЗАГЛУШКА</text>
